name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-check:
    name: PowerShell syntax check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -Include *.ps1, *.psm1, *.psd1
          if (-not $files) { Write-Host 'No PowerShell files found.'; exit 0 }
          $failed = $false
          foreach ($f in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "OK  $($f.FullName)"
            }
          }
          if ($failed) { exit 1 }
